<script>
document.addEventListener('click', e => {
  if (e.target.tagName !== 'IMG' || !e.target.closest('.photos')) return;
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:9999;cursor:zoom-out';
  const big = document.createElement('img');
  big.src = e.target.src;
  big.style.cssText = 'max-width:100vw;max-height:100vh';
  ov.appendChild(big);
  ov.onclick = () => ov.remove();
  document.body.appendChild(ov);
});
</script>
